# On a release tag, builds the environment image and publishes it to GHCR, with the std manifest
# and the core's fingerprint as release assets. A DAG repository then pins the image by digest in
# env/environments.json and adds the std release to env/std.json.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # Some std modules take about 12 GB to build (Lattices.ProgAlgo.Mersenne.EncDigits), more
      # than the runner's 16 GB once other modules build beside them: the runner was killed.
      - name: Swap space
        # On the disk with more free space (/mnt where the runner has one), keeping room for the
        # image build on /.
        run: |
          df -h / /mnt || true
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          d=/; [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ] && d=/mnt
          sudo fallocate -l 16G "$d/swapfile"
          sudo chmod 600 "$d/swapfile"
          sudo mkswap "$d/swapfile"
          sudo swapon "$d/swapfile"
          free -h
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The image's name (GHCR names are lowercase)
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/sigaba-neo-env" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
      - name: The std manifest and the fingerprint
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p release
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "python")
          import dag
          owner = os.environ["OWNER"].lower()
          json.dump({"tag": os.environ["TAG"], "std": dag.std_manifest(),
                     "fingerprint": dag.text_fingerprint(),
                     "image": f"ghcr.io/{owner}/sigaba-neo-env@{os.environ['DIGEST']}"},
                    open("release/environment.json", "w"), indent=1)
          PY
          cat release/environment.json | head -5
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Environment image and std release."
          gh release upload "$GITHUB_REF_NAME" release/environment.json -R "$GITHUB_REPOSITORY" --clobber
