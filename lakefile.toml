name = "SigabaNeo"
version = "0.1.0"
defaultTargets = ["SigabaNeo", "SigabaNeoStd"]

# Every dependency is pinned to an exact commit (spec §2). See docs/M0.md for why these.
# The machine model is cslib-frontier's probabilistic multi-tape Turing machine. Mathlib and cslib
# come transitively through cslib-frontier's own pins; never pin them separately. Bump this SHA
# together with lean-toolchain (which must equal cslib-frontier's at the SHA).
[[require]]
name = "cslib-frontier"
git = "https://github.com/cslib-community/cslib-frontier"
rev = "d25e68fd262c7aef49179602e784804fb790ced6"

[[lean_lib]]
name = "SigabaNeo"
# The core: the trusted check and definitions (`SigabaNeo.Trusted.*`), and the untrusted helpers of
# the tooling (`SigabaNeo.Assemble`, `SigabaNeo.Platform`, python/).
roots = [
  "SigabaNeo", "SigabaNeo.Assemble", "SigabaNeo.Platform", "SigabaNeo.Trusted.Assumption",
  "SigabaNeo.Trusted.Primitive", "SigabaNeo.Trusted.Submission"]

# The standard library (docs/GITHUB_PLATFORM.md, "std"): curated by the maintainers from the DAG,
# imported by every agent's workspace. Not trusted: the check builds it and replays it.
[[lean_lib]]
name = "SigabaNeoStd"
# Every module, not only those the umbrella imports: the std manifest lists them all, and the
# environment image must carry the build outputs of each.
roots = ["SigabaNeoStd"]
globs = ["SigabaNeoStd.+"]
